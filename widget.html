function nascosto(e) { e.setAttribute("aria-hidden", "true"); return e; }

function applicaColore(nome) {
  // Esadecimale (#RRGGBB) usato così com'è; altrimenti nome colore Notion con coppia chiaro/scuro
  const raw = typeof nome === "string" ? nome.trim() : "";
  const hex = /^#[0-9a-fA-F]{6}$/.test(raw) ? raw : null;
  const col = hex || scegliColore(nome, mq.matches);
  radice.style.setProperty("--c", col);

  // Regola dinamica calendario: rosso di default, blu se il colore della materia è rosso
  let isRosso = raw.toLowerCase() === "red" || /^#(d44c47|df5452)$/i.test(col);
  if (!isRosso && hex) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    isRosso = r >= 170 && r > g * 1.6 && r > b * 1.6;
  }
  radice.style.setProperty("--cal-start", isRosso ? "#2B99FF" : "#FF6B00");
  radice.style.setProperty("--cal-end", isRosso ? "#0051E6" : "#E61919");
  radice.style.setProperty("--cal-text", isRosso ? "#0047CC" : "#D91B1B");
}

// appelli: elenco [{n, data}] solo quando i rombi sono selezionabili (caso B), altrimenti null
function pallino(p, appelli) {
  let cl = "dot " + p.stato + (p.oggi && p.stato !== "oggi" ? " oggi" : "");
  if (p.itinere && p.stato !== "itinere") cl += " itinere";
  const selezionabile = !!appelli && !!p.appello;
  if (selezionabile) cl += p.selezionato ? " sel" : " spento";
  const d = el("div", cl);
  d.title = p.titolo;
  if (selezionabile) {
    const a = appelli.find(x => x.n === p.appello);
    d.setAttribute("role", "button");
    d.tabIndex = 0;
    d.setAttribute("aria-pressed", String(!!p.selezionato));
    d.setAttribute("aria-label", etichettaAriaAppello(a.n, a.data, !!p.selezionato));
    d.dataset.n = String(a.n);
    d.addEventListener("click", () => scegli(a, "dot", false));
    d.addEventListener("keydown", ev => {
      if (ev.key === "Enter" || ev.key === " " || ev.key === "Spacebar") { ev.preventDefault(); scegli(a, "dot", true); }
    });
  }
  return d;
}
function griglia(piano, appelli) {
  const flusso = piano.gruppo === "settimane"; // non prodotto da costruisciGiorni; ramo conservato per i dati "a settimane"
  const sett = cfg.mode === "week";
  const col = sett ? 7 : COLONNE_PALLINI; // ?mode=week: una sola riga da 7; altrimenti 14 colonne = due settimane per riga
  const g = el("div", "griglia" + (flusso ? " flusso" : "") + (sett ? " settimana" : ""));
  // Dati letti da adatta() per calcolare il diametro: colonne, celle vuote iniziali, numero di giorni
  g.dataset.col = String(col);
  g.dataset.off = String(piano.offset);
  g.dataset.n = String(piano.items.length);
  g.style.setProperty("--col", String(col));
  if (!flusso) {
    for (let i = 0; i < col; i++) g.append(nascosto(el("div", "gg", LETTERE[i % 7])));
    for (let i = 0; i < piano.offset; i++) g.append(nascosto(el("div", "vuoto")));
  }
  piano.items.forEach(p => g.append(pallino(p, appelli)));
  return g;
}
// Riquadro: "Mancano N giorni" → span.num (numero grande) + " giorni rimanenti": il textContent di .principale resta "N giorni rimanenti"
function testo(t, appello) {
  const p = el("p", "testo"), pr = el("span", "principale");
  const m = typeof t.principale === "string" ? t.principale.match(/^Mancano (\d+) giorni$/i) : null;
  if (m) pr.append(el("span", "num", m[1]), document.createTextNode(" giorni rimanenti"));
  else { pr.textContent = t.principale; pr.classList.add("medio"); }
  p.append(pr);
  if (appello) p.append(el("span", "appello", appello)); // solo con più appelli (o solo il 2°)
  if (t.data) p.append(el("span", "data", t.data));
  return p;
}

// Mesi dal primo giorno del piano all'appello più lontano (tutti i mesi intermedi); stati dei giorni dal piano (applicaEventi).
// Prima del piano: .passato; dopo l'ultimo appello: .fuori (tenue, non interattivo).
function mesiMateria(piano, appelli) {
  const p0 = piano.items[0].ms, u = piano.items[piano.items.length - 1].ms, a = new Date(p0), b = new Date(u);
  const n = (b.getUTCFullYear() - a.getUTCFullYear()) * 12 + b.getUTCMonth() - a.getUTCMonth() + 1;
  const mappa = new Map(piano.items.map(x => [x.ms, x]));
  const wrap = el("div", "mesi-materia");
  mesiPeriodo(formatISO(p0), n).forEach(m => {
    const nome = MESI_LUNGHI[m.mese], blocco = el("div", "cal-mese"), lab = nascosto(el("div", "cal-mlab", nome + " " + m.anno));
    blocco.setAttribute("role", "group");
    blocco.setAttribute("aria-label", nome + " " + m.anno);
    lab.dataset.lungo = nome + " " + m.anno;
    lab.dataset.breve = MESI_ABBR[m.mese] + " " + m.anno;
    lab.dataset.minimo = MESI_ABBR[m.mese];
    const g = el("div", "griglia mese fitta");
    g.style.setProperty("--col", "7");
    LETTERE.forEach(l => g.append(nascosto(el("div", "gg", l))));
    costruisciMese(m.anno, m.mese).forEach(c => {
      if (c.ms === null) { g.append(nascosto(el("div", "vuoto"))); return; }
      const x = mappa.get(c.ms);
      if (x) { g.append(pallino(x, appelli)); return; }
      const d = el("div", "dot " + (c.ms < p0 ? "passato" : "fuori"));
      d.title = titoloGiorno(c.ms, c.ms < p0 ? "passato" : "futuro", false);
      g.append(d);
    });
    blocco.append(lab, g);
    wrap.append(blocco);
  });
  return wrap;
}

// Pillole "1° · 12 gen" / "2° · 2 feb": stessa selezione dei rombi, bersagli di tocco più comodi
function pillole(appelli, selN) {
  const g = el("div", "appelli");
  g.setAttribute("role", "group");
  g.setAttribute("aria-label", "Scelta dell'appello");
  appelli.forEach(a => {
    const sel = a.n === selN;
    const b = el("button", "pillola" + (sel ? " sel" : ""), etichettaPillola(a.n, a.data));
    b.type = "button";
    b.setAttribute("aria-pressed", String(sel));
    b.setAttribute("aria-label", etichettaAriaAppello(a.n, a.data, sel));
    b.dataset.n = String(a.n);
    b.addEventListener("click", ev => scegli(a, "pillola", ev.detail === 0)); // detail 0 = da tastiera
    g.append(b);
  });
  return g;
}
// Cambia la selezione e ridisegna tutto senza nuovo fetch; da tastiera rimette il focus sull'elemento attivato
function scegli(a, origine, daTastiera) {
  st.appello = { n: a.n, data: a.data };
  salvaAppello(st.appello);
  disegna();
  if (!daTastiera) return;
  const e = box.querySelector((origine === "pillola" ? ".pillola" : ".dot") + '[data-n="' + a.n + '"]');
  if (e) e.focus();
}

function ruotaGiorni(oggi) {
  const wrap = nascosto(el("div", "ruota-giorni"));
  wrap.append(el("div", "ruota-arco"));
  const angoli = [-46, -23, 0, 23, 46];
  for (let i = 0; i < angoli.length; i++) {
    const offset = i - 2;
    const d = new Date(oggi + offset * MS_DAY);
    const gg = String(d.getUTCDate()).padStart(2, "0");
    const dist = Math.abs(offset);
    const item = el("div", "ruota-item " + (dist === 0 ? "corrente" : "dist-" + dist));
    item.style.setProperty("--ang", angoli[i] + "deg");
    item.append(el("span", "ruota-nodo"));
    if (offset === 0) {
      const focus = el("div", "giorno-focus");
      const meseAnno = MESI_BREVI[d.getUTCMonth()] + " " + String(d.getUTCFullYear()).slice(-2);
      focus.append(
        el("span", "giorno-focus-num", gg),
        el("span", "giorno-focus-mese", meseAnno)
      );
      item.append(focus);
    } else {
      item.append(el("span", "ruota-num-adj", gg));
    }
    wrap.append(item);
  }
  return wrap;
}

function scheletro() {
  box.className = "box neutro";
  box.setAttribute("aria-busy", "true");
  box.setAttribute("aria-label", "Caricamento in corso");
  box.append(el("div", "sk sk-titolo"));
  // Stessa struttura del contenuto: riquadro | 3 mesi segnaposto (o una riga da 7 in ?mode=week) | ruota
  if (cfg.label) { const c = el("div", "col-conto"); c.append(el("div", "sk sk-testo")); box.append(c); }
  const cm = el("div", "col-mesi");
  if (cfg.mode === "week") {
    const g = el("div", "griglia settimana");
    g.style.setProperty("--col", "7");
    for (let i = 0; i < 7; i++) g.append(el("div", "gg", "\u00a0"));
    for (let i = 0; i < 7; i++) g.append(el("div", "dot sk"));
    cm.append(g);
  } else {
    const mm = el("div", "mesi-materia");
    for (let i = 0; i < 3; i++) { const b = el("div", "cal-mese"); b.append(el("div", "cal-mlab"), el("div", "sk sk-mgrid")); mm.append(b); }
    cm.append(mm);
  }
  box.append(cm);
  const cr = el("div", "col-ruota"), rSk = nascosto(el("div", "ruota-giorni ruota-sk"));
  rSk.append(el("div", "ruota-arco"));
  const item0 = el("div", "ruota-item corrente");
  item0.style.setProperty("--ang", "0deg");
  item0.append(el("span", "ruota-nodo"), el("div", "giorno-focus sk"));
  rSk.append(item0);
  cr.append(rSk);
  box.append(cr);
}
function errore() {
  box.className = "box neutro errore";
  box.setAttribute("aria-label", "Impossibile caricare i dati");
  box.append(el("div", "testo", "Impossibile caricare i dati"));
}

function costruisci() {
  box.replaceChildren();
  box.removeAttribute("aria-busy");
  document.body.classList.toggle("solid", cfg.solid);
  applicaColore("default");
  if (st.fase === "caricamento") return ca.attivo ? scheletroAnno() : scheletro();
  if (st.fase === "errore") return errore();
  if (ca.attivo) return disegnaAnno();

  const oggi = oggiUTC();
  const d = unisciDati(st.grezzo, cfg);
  applicaColore(d.colore);
  box.className = "box";
  if (d.nome) box.append(el("div", "titolo", d.nome));

  const cC = el("div", "col-conto"), cM = el("div", "col-mesi"), cR = el("div", "col-ruota"); // ordine nel DOM = ordine di tabulazione
  if (cfg.mode === "week") {
    box.setAttribute("aria-label", etichettaSettimana(d.nome, oggi));
    if (cfg.label) cC.append(testo({ principale: testoSettimana(oggi), data: "" }));
    cM.append(griglia(costruisciSettimana(oggi)));
  } else {
    // Appelli e itinere: con l'override ?exam= vengono ignorati (grezzo = null) e il widget resta com'è sempre stato
    const grezzo = cfg.hasExam ? null : st.grezzo;
    const appelli = appelliDisponibili(grezzo);
    const selN = scegliAppello(appelli, oggi, st.appello || leggiAppelloSalvato());
    const numerati = appelli.length > 1 || (appelli.length === 1 && appelli[0].n === 2); // false = caso A
    const selezionabili = appelli.length === 2; // caso B
    const esameSel = appelli.length ? appelli.find(a => a.n === selN).data : d.esame;

    box.setAttribute("aria-label", etichettaAria(d.nome, oggi, esameSel) + (numerati ? ", " + etichettaAppello(selN) : ""));
    const t = testoConto(oggi, esameSel);
    if (cfg.label || esameSel === null) cC.append(testo(t, numerati ? dicituraConto(t.principale, selN) : "")); // "Data esame non impostata" resta sempre
    if (selezionabili && cfg.label) {
      cM.append(pillole(appelli, selN));
      box.classList.add("con-appelli");
    }
    let piano;
    if (appelli.length) {
      const date = elencaDate(grezzo);
      const ini = inizioEffettivo(oggi, d.inizio, { appelli: appelli.map(a => a.data), itinere: [date.i1, date.i2].filter(s => s !== null) });
      piano = applicaEventi(costruisciGiorni(oggi, ultimaData(appelli), ini), costruisciEventi(appelli, date, selN, numerati));
    } else {
      piano = costruisciGiorni(oggi, esameSel, d.inizio);
    }
    if (piano.items.length) cM.append(mesiMateria(piano, selezionabili ? appelli : null));
  }
  if (cC.firstChild) box.append(cC);
  if (cM.firstChild) box.append(cM);
  cR.append(ruotaGiorni(oggi));
  box.append(cR);
  if (st.nota) box.append(el("p", "nota", "dati non aggiornati"));
}

// Ridisegna e adatta le dimensioni allo spazio reale dell'iframe
function disegna() {
  // Calendario annuale: se il focus era su un giorno, dopo il ridisegno torna sullo stesso
  const f = ca.attivo && box.contains(document.activeElement) ? document.activeElement.dataset.f : null;
  costruisci();
  adatta();
  if (f) { const e = box.querySelector('[data-f="' + f + '"]'); if (e) e.focus(); }
}

// ---------- Adattamento allo spazio reale dell'iframe ----------
// Si misurano solo grandezze che NON dipendono dal contenuto delle colonne: larghezza e altezza interne del box (meno la nota)
// e le dimensioni NATURALI (scala 1) di riquadro, ruota e riga di pillole. layoutMateria (pura) ne ricava larghezze, scale e
// diametro; JS le passa come custom properties (--w1/--w2/--w3, --gap, --ck, --rk, --dp...). Nessuna di queste cambia le misure
// lette: niente retroazione. Valori in px reali; con ?zoom i figli del box sono scalati, quindi i valori CSS dentro valgono px / zoom.
const DIAMETRO_MIN = 3;
let rafAdatta = 0, modoLayout = null;
function pianificaAdatta() {
  if (rafAdatta) return;
  rafAdatta = requestAnimationFrame(() => { rafAdatta = 0; adatta(); });
}
// Misure dei mesi della vista materia (stessa logica dell'annuale, adattaAnno resta invariata)
function dimensionaMesi(m, colonne, d, z) {
  const M = metricheMese(d);
  m.style.setProperty("--mc", String(colonne));
  m.style.setProperty("--dp", d / z + "px");
  m.style.setProperty("--rg", String(RAPPORTO_GAP_MESI));
  m.style.setProperty("--k", String(Math.max(0.25, Math.min(2, d / z / 14))));
  m.style.setProperty("--fs", M.fs / z + "px");
  m.style.setProperty("--lh", M.lh / z + "px");
  m.style.setProperty("--gb", M.gb / z + "px");
  m.classList.toggle("senza-gg", !M.lettere);
  m.classList.toggle("mini", d < 8);
  m.querySelectorAll(".cal-mlab").forEach(lab => {
    if (!lab.dataset.lungo) return;
    const stima = M.fs * 0.74, t = stima * lab.dataset.lungo.length <= M.w ? lab.dataset.lungo : stima * lab.dataset.breve.length <= M.w ? lab.dataset.breve : lab.dataset.minimo;
    if (lab.textContent !== t) lab.textContent = t;
  });
}
// Misura naturale del riquadro (anche lo scheletro .sk-testo), margini inclusi; null se non c'è
function contoNat(cc, z) {
  const t = cc && cc.querySelector(".testo, .sk-testo");
  if (!t) return null;
  const r = t.getBoundingClientRect(), c = getComputedStyle(t);
  return { w: r.width, h: r.height + ((parseFloat(c.marginTop) || 0) + (parseFloat(c.marginBottom) || 0)) * z };
}
function adatta() {
  if (ca.attivo) return adattaAnno();
  const cc = box.querySelector(".col-conto"), cm = box.querySelector(".col-mesi"), cr = box.querySelector(".col-ruota");
  box.classList.toggle("senza-griglia", !box.querySelector(".griglia"));
  if (!cr) { box.style.removeProperty("--hm"); return; }
  const px = v => parseFloat(v) || 0, z = zoomVal, cs = getComputedStyle(box);
  const nota = box.querySelector(".nota"), hNota = nota ? nota.getBoundingClientRect().height + 8 * z : 0;
  const W = box.clientWidth - px(cs.paddingLeft) - px(cs.paddingRight);
  const H = box.clientHeight - px(cs.paddingTop) - px(cs.paddingBottom) - hNota;
  const dim = e => { const r = e.getBoundingClientRect(); return { w: r.width, h: r.height }; };
  const ruota = cr.firstElementChild, mm = cm && cm.querySelector(".mesi-materia"), gw = cm && cm.querySelector(".griglia.settimana");
  box.classList.remove("no-ruota"); // la ruota va misurata visibile
  if (cc) cc.style.setProperty("--ck", "1");
  ruota.style.setProperty("--rk", "1");
  const pl = cm && cm.querySelector(".appelli");
  let pillole = null;
  if (pl) { pl.style.maxWidth = "none"; const r = dim(pl); pl.style.maxWidth = ""; pillole = { w: r.w, h: r.h, g: 8 * z, rg: 4 * z }; }
  const L = layoutMateria(W, H, mm ? mm.children.length : 1, {
    conto: contoNat(cc, z), ruota: dim(ruota), pillole,
    senzaMesi: !cm, settimana: !mm, maxD: Math.min(cfg.size, 40) * z, prev: modoLayout // ?size = diametro massimo
  });
  modoLayout = L.modo;
  box.classList.toggle("impilato", L.modo === "impilato");
  box.classList.toggle("no-ruota", !L.mostraRuota);
  box.classList.toggle("no-conto", !cc);
  box.classList.toggle("no-mesi", !cm);
  box.style.setProperty("--w1", L.w1 + "px");
  box.style.setProperty("--w2", L.w2 + "px");
  box.style.setProperty("--w3", L.w3 + "px");
  box.style.setProperty("--gap", L.gap + "px");
  box.style.setProperty("--gv", L.gv + "px");
  if (cc) cc.style.setProperty("--ck", String(L.ck));
  ruota.style.setProperty("--rk", String(L.rk));
  if (mm) dimensionaMesi(mm, L.colonne, L.d, z);
  else if (gw) {
    gw.style.setProperty("--dp", L.d / z + "px");
    gw.style.setProperty("--rg", String(L.rg));
    gw.style.setProperty("--k", String(Math.max(0.25, Math.min(2, L.d / z / 14))));
    gw.classList.toggle("senza-gg", !L.lettere);
    gw.classList.toggle("mini", L.d < 8);
  }
  if (L.hMed + 1 < H) box.style.setProperty("--hm", Math.ceil(L.hMed) + "px");
  else box.style.removeProperty("--hm");
}

// ---------- Parte 3: calendari annuali ----------
const chiaveAnno = () => "widget-anno:" + ca.anno;
function leggiSalvatoAnno() {
  try { const d = JSON.parse(localStorage.getItem(chiaveAnno())); return annoValido(d) ? d : null; } catch (e) { return null; } // storage bloccato
}
function salvaAnno(d) {
  try { localStorage.setItem(chiaveAnno(), JSON.stringify(d)); } catch (e) { /* ignora */ }
}
// Sorgenti: data/anno-N.json, poi /api/anno?n=N (può non esistere: errore gestito come per le materie)
async function leggiDatiAnno(segnale) {
  let ultimo = new Error("nessuna sorgente");
  for (const u of ["data/anno-" + ca.anno + ".json", "/api/anno?n=" + ca.anno]) {
    try {
      const r = await fetch(u, { cache: "no-cache", signal: segnale });
      if (!r.ok) throw new Error("http");
      const d = await r.json();
      if (!annoValido(d)) throw new Error("formato");
      return d;
    } catch (e) { ultimo = e; }
  }
  throw ultimo;
}
async function caricaAnno() {
  const mio = ++st.seq;
  st.giorno = oggiUTC();
  if (!ca.anno) { st.fase = "errore"; disegna(); return; }
  const ctrl = new AbortController();
  const to = setTimeout(() => ctrl.abort(), 10000);
  try {
    const d = await leggiDatiAnno(ctrl.signal);
    salvaAnno(d);
    if (mio !== st.seq) return;
    st.grezzo = d; st.nota = d.stale === true || datiVecchi(d); st.fase = "ok";
  } catch (e) {
    if (mio !== st.seq) return;
    const s = st.grezzo || leggiSalvatoAnno();
    if (s) { st.grezzo = s; st.nota = true; st.fase = "ok"; }
    else st.fase = "errore";
  } finally {
    clearTimeout(to);
  }
  disegna();
}
// Struttura comune a scheletro e contenuto: intestazione | area (con i mesi) ; legenda e nota si aggiungono dopo.
// L'area è osservata (ResizeObserver): se intestazione o legenda cambiano altezza i mesi si riadattano.
function strutturaAnno() {
  const testa = el("div", "cal-testa"), area = el("div", "cal-area"), mesi = el("div", "cal-mesi");
  area.append(mesi);
  box.append(testa, area);
  if (ro) ro.observe(area);
  return { testa, mesi };
}
function scheletroAnno() {
  box.className = "box anno";
  box.setAttribute("aria-busy", "true");
  box.setAttribute("aria-label", "Caricamento in corso");
  const S = strutturaAnno();
  S.testa.append(el("div", "sk sk-testa"));
  for (let i = 0; i < 11; i++) {
    const b = el("div", "cal-mese");
    b.append(el("div", "cal-mlab"), el("div", "sk sk-mgrid"));
    S.mesi.append(b);
  }
  const leg = el("div", "cal-legenda");
  leg.append(el("div", "sk sk-legbar"));
  box.append(leg);
}

// Colore effettivo di una variante: da v4 in poi si cicla la luminosità (più chiaro, più scuro)
function coloreVariante(hex, v) {
  const t = Math.floor(v / 4) % 3;
  return t === 1 ? "color-mix(in srgb, " + hex + " 60%, #fff)" : t === 2 ? "color-mix(in srgb, " + hex + " 60%, #000)" : hex;
}
// Pallino di evento: sagoma dal tipo (rombo = appello, triangolo = itinere). Una materia: colore e variante (v) della materia;
// più materie (max 3): spicchi a conic-gradient. Il contorno e le ombre vengono dal CSS dei pallini delle materie.
function dotEvento(forma, colori, v) {
  const d = el("div", "dot ev " + (forma === "appello" ? "esame" : "itinere"));
  if (colori.length === 1) {
    d.classList.add("v" + (v % 4));
    d.style.setProperty("--c", coloreVariante(colori[0], v));
  } else {
    d.style.setProperty("--c", colori[0]);
    const q = 100 / colori.length;
    d.style.setProperty("--pie", "conic-gradient(" + colori.map((c, i) => c + " 0 " + Math.round((i + 1) * q * 100) / 100 + "%").join(", ") + ")");
  }
  return d;
}
function campione(forma, hex, v, conseg) {
  const w = nascosto(el("span", "cal-camp")), d = dotEvento(forma, [hex], v);
  if (conseg) d.classList.add("conseg");
  w.append(d);
  return w;
}
function elencoEventi(lista) {
  return lista.map(e => e.nome + " · " + etichettaEvento(e) + (e.conseguita ? " (conseguita)" : "")).join("; ");
}

// Intestazione: "Anno N · periodo"; con un giorno selezionato, data lunga ed eventi di quel giorno
function aggiornaTesta() {
  const t = sa.testa;
  if (!t) return;
  t.replaceChildren();
  if (sa.sel !== null && sa.ev && sa.ev.has(sa.sel)) {
    const txt = elencoEventi(sa.ev.get(sa.sel));
    t.append(el("b", null, FMT_LUNGA.format(sa.sel)), document.createTextNode(" · " + txt));
    t.title = FMT_LUNGA.format(sa.sel) + " · " + txt;
  } else {
    t.append(el("b", null, "Anno " + ca.anno), document.createTextNode(" · " + sa.periodo));
    t.removeAttribute("title");
  }
}
// Selezione senza ridisegnare (il focus resta dov'è)
function aggiornaSelezione() {
  box.querySelectorAll('.dot[role="button"]').forEach(d => {
    const on = Number(d.dataset.ms) === sa.sel;
    d.classList.toggle("sel", on);
    d.setAttribute("aria-pressed", String(on));
  });
  aggiornaTesta();
}
function seleziona(ms) {
  sa.sel = sa.sel === ms ? null : ms;
  aggiornaSelezione();
}

function legendaAnno(princ, recu, hex, vv) {
  const L = el("div", "cal-legenda"), g = el("div", "cal-gruppi");
  const voce = x => {
    const nome = (typeof x.nome === "string" && x.nome) || x.slug, cons = x.conseguita === true;
    const li = el("li", "cal-voce" + (cons ? " conseg" : "")), n = el("span", "cal-nome", nome);
    li.title = nome + (cons ? " (conseguita)" : "");
    li.setAttribute("aria-label", li.title);
    if (cons) n.append(el("span", "sr", " (conseguita)"));
    li.append(campione("appello", hex[x.slug], vv[x.slug] || 0, cons));
    if (cons) li.append(nascosto(el("span", "cal-ok", "✓")));
    li.append(n);
    return li;
  };
  const lista = (voci, tit) => { const ul = el("ul", "cal-voci"); ul.setAttribute("aria-label", tit); voci.forEach(x => ul.append(voce(x))); return ul; };
  if (princ.length) g.append(lista(princ, "Materie · Anno " + ca.anno));
  if (recu.length) {
    const r = el("div", "cal-rec");
    r.append(el("span", "cal-rec-et", "Da recuperare"), lista(recu, "Da recuperare · Anno " + (ca.anno - 1)));
    g.append(r);
  }
  L.append(g);
  const key = nascosto(el("div", "cal-key"));
  [["appello", "appello"], ["itinere", "itinere"]].forEach(([f, t]) => {
    const k = el("span", "cal-k"), w = el("span", "cal-camp"), d = el("div", "dot ev " + (f === "appello" ? "esame" : "itinere"));
    w.append(d);
    k.append(w, t);
    key.append(k);
  });
  L.prepend(key); // la chiave appello/itinere diventa la prima riga, sopra le materie normali
  return L;
}

function disegnaAnno() {
  const oggi = oggiUTC(), d = st.grezzo, mesi = mesiPeriodo(d.finestra.da);
  if (mesi.length) { const u = mesi[mesi.length - 1]; mesi.push({ anno: u.anno, mese: 8, chiave: u.anno + "-09" }); } // + settembre (senza agosto)
  const est = estremiMesi(mesi);
  const mat = d.materie.filter(x => x && typeof x.slug === "string");
  const rec = x => ca.anno > 1 && x.recupero === true;
  const princ = mat.filter(x => !rec(x)), recu = mat.filter(rec), ord = princ.concat(recu), hex = {};
  ord.forEach(x => { hex[x.slug] = risolviColore(x.colore, mq.matches); });
  const vv = assegnaVarianti(ord.map(x => ({ slug: x.slug, hex: hex[x.slug] })));
  const ev = eventiPerGiorno(ord, est.da, est.a);

  box.className = "box anno";
  box.setAttribute("aria-label", "Calendario anno " + ca.anno);
  const S = strutturaAnno();
  sa.ev = ev; sa.testa = S.testa; sa.periodo = intervalloFinestra(est.da, est.a);
  if (sa.sel !== null && !ev.has(sa.sel)) sa.sel = null; // i dati possono essere cambiati

  mesi.forEach(m => {
    const nome = MESI_LUNGHI[m.mese], blocco = el("div", "cal-mese"), lab = nascosto(el("div", "cal-mlab", nome + " " + m.anno));
    blocco.setAttribute("role", "group");
    blocco.setAttribute("aria-label", nome + " " + m.anno);
    lab.dataset.lungo = nome + " " + m.anno;
    lab.dataset.breve = MESI_ABBR[m.mese] + " " + m.anno;
    lab.dataset.minimo = MESI_ABBR[m.mese];
    const g = el("div", "griglia mese fitta");
    g.style.setProperty("--col", "7");
    LETTERE.forEach(l => g.append(nascosto(el("div", "gg", l))));
    costruisciMese(m.anno, m.mese).forEach(c => {
      if (c.ms === null) { g.append(nascosto(el("div", "vuoto"))); return; }
      const lista = ev.get(c.ms), isOggi = c.ms === oggi, data = FMT_LUNGA.format(c.ms) + (isOggi ? " (oggi)" : "");
      let dot;
      if (!lista) {
        dot = el("div", "dot " + (isOggi ? "oggi" : c.ms < oggi ? "passato" : "futuro"));
        dot.title = data;
      } else {
        const cb = combinaEventi(lista);
        dot = dotEvento(cb.forma, cb.materie.map(s => hex[s]), vv[cb.materie[0]] || 0);
        if (c.ms < oggi) dot.classList.add("att");
        if (lista.every(e => e.conseguita)) dot.classList.add("conseg");
        if (isOggi) dot.classList.add("oggi");
        if (sa.sel === c.ms) dot.classList.add("sel");
        dot.title = data + ": " + elencoEventi(lista);
        dot.append(nascosto(el("i", "hit")));
        dot.setAttribute("role", "button");
        dot.tabIndex = 0;
        dot.setAttribute("aria-pressed", String(sa.sel === c.ms));
        dot.setAttribute("aria-label", etichettaAriaGiorno(c.ms, lista));
        dot.dataset.ms = String(c.ms);
        dot.dataset.f = "c" + c.ms;
        dot.addEventListener("click", () => seleziona(c.ms));
        dot.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " " || e.key === "Spacebar") { e.preventDefault(); seleziona(c.ms); } });
      }
      g.append(dot);
    });
    blocco.append(lab, g);
    S.mesi.append(blocco);
  });
  aggiornaTesta();
  if (ord.length) box.append(legendaAnno(princ, recu, hex, vv)); // JSON vuoto: calendario senza legenda
  if (st.nota) box.append(el("p", "nota", "dati non aggiornati"));
}

// Disposizione dei mesi: l'area si ricava dalle grandezze del box (non zoomato), non dal contenuto dei mesi:
// larghezza interna e altezza della riga 2 della griglia del box (1fr). Valori in px reali; con ?zoom i figli del box
// sono scalati, quindi i valori CSS dentro i mesi valgono px / zoom (come per il widget per materia).
function adattaAnno() {
  const mesi = box.querySelector(".cal-mesi");
  if (!mesi) return;
  const px = v => parseFloat(v) || 0, cs = getComputedStyle(box);
  const W = box.clientWidth - px(cs.paddingLeft) - px(cs.paddingRight);
  const H = cs.gridTemplateRows.split(/\s+/).map(px)[1] || 0;
  const L = layoutMesi(W, H, mesi.children.length), M = metricheMese(L.d), z = zoomVal;
  mesi.style.setProperty("--mc", String(L.colonne));
  mesi.style.setProperty("--dp", L.d / z + "px");
  mesi.style.setProperty("--rg", String(RAPPORTO_GAP_MESI));
  mesi.style.setProperty("--k", String(Math.max(0.25, Math.min(2, L.d / z / 14))));
  mesi.style.setProperty("--fs", M.fs / z + "px");
  mesi.style.setProperty("--lh", M.lh / z + "px");
  mesi.style.setProperty("--gb", M.gb / z + "px");
  mesi.classList.toggle("senza-gg", !M.lettere);
  mesi.classList.toggle("mini", L.d < 8);
  mesi.querySelectorAll(".cal-mlab").forEach(lab => {
    if (!lab.dataset.lungo) return;
    const stima = M.fs * 0.74, t = stima * lab.dataset.lungo.length <= M.w ? lab.dataset.lungo : stima * lab.dataset.breve.length <= M.w ? lab.dataset.breve : lab.dataset.minimo;
    if (lab.textContent !== t) lab.textContent = t;
  });
}
// Esc deseleziona il giorno
box.addEventListener("keydown", e => {
  if (!ca.attivo || st.fase !== "ok") return;
  if (e.key === "Escape" && sa.sel !== null) { sa.sel = null; aggiornaSelezione(); }
});

// ---------- Timer e avvio ----------
function pianifica() {
  clearTimeout(st.timer);
  st.timer = setTimeout(() => { carica(); pianifica(); }, msAllaMezzanotte(Date.now()));
}

radice.classList.add(ca.attivo ? "vista-anno" : "vista-materia");
// Zoom opzionale (?zoom=1.4): valori non validi o assenti = 1; limitato tra 0.5 e 3
const zoomRaw = Number((new URLSearchParams(location.search).get("zoom") || "").replace(",", "."));
const zoomVal = Number.isFinite(zoomRaw) && zoomRaw > 0 ? Math.min(Math.max(zoomRaw, 0.5), 3) : 1;
radice.style.setProperty("--z", String(zoomVal));
disegna(); // scheletro
// Ridimensionamento dell'iframe a runtime (l'altezza la sceglie l'utente in Notion): si riadatta, una volta per frame
if (typeof ResizeObserver === "function") { ro = new ResizeObserver(pianificaAdatta); ro.observe(box); }
window.addEventListener("resize", pianificaAdatta);
carica();
pianifica();

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  pianifica(); // i timer possono slittare quando la pagina è in background
  if (st.giorno !== oggiUTC()) carica(); else disegna();
});
if (mq.addEventListener) mq.addEventListener("change", disegna);
else if (mq.addListener) mq.addListener(disegna);

})();
</script>
</body>
</html>
